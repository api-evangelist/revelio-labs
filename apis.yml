aid: revelio-labs
name: Revelio Labs
description: >-
  Revelio Labs is a workforce intelligence company that builds a universal HR
  database from public professional profiles, job postings, employee reviews,
  and WARN layoff notices. It maps more than 1.1 billion profiles across 20
  million+ companies and 5,000+ skills into standardized datasets covering
  workforce dynamics (headcount, hiring and attrition flows, transitions),
  job postings (the COSMOS dataset), sentiment, layoffs, and individual-level
  user, position, education, and skill files. The data is delivered through a
  REST API, bulk data feeds, and an interactive dashboard, letting investors,
  corporations, and researchers analyze companies, labor markets, and talent
  trends in near real time.
